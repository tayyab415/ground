# Live site: https://tayyab415.github.io/ground/
# Push (or workflow_dispatch) on main → test → build dist with BASE_PATH=/ground/ → deploy.
# GitHub Pages source must be "GitHub Actions", not branch /docs. The committed
# /docs snapshot is a preview copy, not what the public URL serves.
name: test-and-pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flask
      - run: python3 -m unittest test_auth.py
        working-directory: server
      - run: npm run build
        env:
          BASE_PATH: /ground/
      - name: Confirm the Pages bundle uses /ground/
        run: grep -q '/ground/assets/' dist/index.html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
